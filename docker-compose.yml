services:
  mongo:
    image: mongo:7
    ports: ["27018:27017"]
    volumes: ["mongo_data:/data/db"]
  ai:
    build: ./ai-service
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    ports: ["8001:8000"]
  server:
    build: ./server
    environment:
      MONGO_URI: mongodb://mongo:27017/knowledgepilot
      AI_URL: http://ai:8000
      PORT: 5000
    ports: ["5001:5000"]
    depends_on: [mongo, ai]
  client:
    build: ./client
    environment:
      VITE_API_URL: http://localhost:5001
    ports: ["4174:4173"]
    depends_on: [server]
volumes:
  mongo_data:
